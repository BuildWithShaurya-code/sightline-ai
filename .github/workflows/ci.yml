name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified 2026-10-19
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-vercel-preflight.mjs
      - name: Source and rendering checks
        shell: bash
        run: |
          set -euo pipefail
          for check in qa/*_checks.cjs; do node "$check"; done
      - name: Validate publishable package
        run: python3 scripts/export_review_package.py --check

  backend-contracts:
    name: Backend security and contracts (model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SUPABASE_URL: https://fixture.supabase.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Configure isolated test storage
        run: |
          printf 'MEDIA_DIR=%s/sightline-test-storage/media\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MODEL_PATH=%s/not-provisioned.pt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PYTHONPYCACHEPREFIX=%s/sightline-pycache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install OS libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install CPU inference wheels
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - name: Public tests without private model or footage
        run: >-
          python -m pytest
          backend/tests/test_schemas.py
          backend/tests/test_config.py
          backend/tests/test_storage_containment.py
          backend/tests/test_release_security.py
          backend/tests/test_auth_api.py
          backend/tests/test_account_aliases.py
          backend/tests/test_evidence_class_coverage.py
          backend/tests/test_cloud_read_performance.py
          -q
